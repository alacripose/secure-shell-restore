name: hypergrill-audit

on:
  push:
    paths:
      - "docs/**"
      - "tools/**"
      - ".cache/**"
      - ".github/workflows/hypergrill-audit.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - ".cache/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The family checkouts are not part of this repository; a run without them reports
      # `unasked` and refuses a probe it cannot resolve rather than passing quietly.
      - name: Re-audit the 500 slots
        run: python tools/hypergrill_reaudit.py --strict
      - name: Pin the audit's own coverage
        run: python .cache/hg_check10.py
      - name: Ingested-source register
        run: python .cache/hg_check9.py
      - name: Hypergrill counts and section 9.1
        run: python .cache/hg_check7.py
      - name: Resolver contract
        run: python tools/hypergrill_resolver.py self-check
      - name: Handoff ratchet — enumerated refusals and contract
        run: python tools/handoff_ratchet.py list > /dev/null && python tools/handoff_ratchet.py self-check
      - name: Handoff ratchet — the three unit-close cases
        run: python tests/handoff/run_cases.py
      - name: Line endings
        run: python .cache/normalize_lf.py
