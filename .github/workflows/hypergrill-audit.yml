name: hypergrill-audit

on:
  push:
    paths:
      - "docs/**"
      - "tools/**"
      - ".cache/**"
      - "tickets/**"
      - "tests/**"
      - "impl/**"
      - "requirements.txt"
      - ".github/workflows/hypergrill-audit.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - ".cache/**"
      - "tickets/**"
      - "tests/**"
      - "impl/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The family checkouts are not part of this repository; a run without them reports
      # `unasked` and refuses a probe it cannot resolve rather than passing quietly.
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      # The exit test of R4. It reads only this repository, so a runner can execute it; the
      # refusal cases are the plan's own words for the milestone (tampered, ambiguous,
      # foreign-revision refuse by name).
      - name: Package identity contract
        run: python tests/packages/run_cases.py
      # The declared package object: schema ids, the manifest vocabulary and the chunk
      # domains. It also asserts that re-signing and re-chunking do not move identity.
      - name: Canonical manifest contract
        run: python tests/packages/run_cases_canonical.py
      - name: Re-audit the 500 slots
        run: python tools/hypergrill_reaudit.py --strict
      # hg_check10 pins refs into the family checkouts (testport1, secure-shell, shploingus-clean).
      # A runner has none of them, so it cannot run here: it stays a local check. What CI can prove
      # is A-08 — a contradiction fails the run, and a refused probe is not a pass.
      - name: Re-audit reports zero contradictions
        run: python .cache/hg_ci_gate.py
      - name: Ingested-source register
        run: python .cache/hg_check9.py
      # hg_check7 asserts paths on the owner's machine and in the family checkouts. A runner has
      # neither, so it is a local check, like hg_check10. Its absence here is named, not silent.
      - name: Resolver contract
        run: python tools/hypergrill_resolver.py self-check
      - name: Handoff ratchet — enumerated refusals and contract
        run: python tools/handoff_ratchet.py list > /dev/null && python tools/handoff_ratchet.py self-check
      # The enumerated entry: hg_check12 runs the three cases, the missing-store refusal and every
      # committed close against the committed store, so a unit with no receipt fails here and cannot
      # merge. `tests/handoff/run_cases.py` asserts the same three cases and stays the unit's own test.
      - name: Handoff gate — a unit cannot close past the ratchet
        run: python .cache/hg_check12.py
      - name: Line endings
        run: python .cache/normalize_lf.py
